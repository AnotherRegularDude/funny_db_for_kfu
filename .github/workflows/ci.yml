name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby 3.4.7
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: developed_lib
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby 3.4.7
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run RSpec
        run: bundle exec rspec
