name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Ruby 3.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: Run Linter
        run: bundle exec rubocop
      - name: Run Tests
        run: bundle exec rspec
